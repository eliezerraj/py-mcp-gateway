[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mcp-gateway-v2"
version = "0.1.0"
description = "A MCP gateway."
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "asyncpg",
    "cedarpy",
    "opentelemetry-sdk",
    "opentelemetry-api",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp",
    "prometheus-client",
]

[project.scripts]
mcp-gateway = "mcp_gateway.main:run"